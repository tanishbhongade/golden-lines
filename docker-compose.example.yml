services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: pgvector-dhi
    restart: unless-stopped
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_DB: goldenlines 
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U <postgres-user> -d goldenlines"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
